<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Subway Map</title>
<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpClientId=3kxddohdsq"></script>
<style>
html, body, #map { margin:0; width:100%; height:100%; }
</style>
</head>
<body>
<div id="map"></div>

<script>
var map = new naver.maps.Map('map', {
    center: new naver.maps.LatLng(37.5665, 126.9780),
    zoom: 11,
    mapTypeControl: false,
    scaleControl: false,
    logoControl: false,
    mapDataControl: false
});

var subwayMapType = new naver.maps.ImageMapType({
    name: 'SUBWAY',
    tileSize: new naver.maps.Size(256, 256),
    getTileUrl: function(x, y, z) {
        return 'https://map.pstatic.net/nrb/styles/subway/256/' + z + '/' + x + '/' + y + '.png';
    },
    minZoom: 5,
    maxZoom: 16
});

map.mapTypes.set('SUBWAY', subwayMapType);
map.setMapTypeId('SUBWAY');
</script>
</body>
</html>
