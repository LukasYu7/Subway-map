<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>Naver Map – Clean Style</title>

  <style>
    html, body { margin: 0; padding: 0; }
    #map { width: 100vw; height: 100vh; }

    .controls {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: #fff;
      padding: 8px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,.3);
    }
  </style>

  <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=3kxddohdsq"></script>
</head>
<body>

<div class="controls">
  <button id="togglePoi">POI 끄기</button>
</div>

<div id="map"></div>

<script>
  // ✅ 1. 스타일 적용된 배경 지도
  const map = new naver.maps.Map('map', {
    center: new naver.maps.LatLng(37.5665, 126.9780),
    zoom: 14,
    zoomDelta: 0.5,
    mapTypes: new naver.maps.MapTypeRegistry({
      normal: naver.maps.NaverStyleMapTypeOptions.getVectorMap({
        style: 'eeab16cf-99a8-4f34-8b75-8503a18521e0',
        version: '20260109130246'
      })
    })
  });

  // ✅ 2. POI / 라벨 레이어 (토글용)
  const labelLayer = new naver.maps.Layer(
    'label',
    new naver.maps.MapTypeRegistry({
      label: naver.maps.NaverStyleMapTypeOptions.getNormalLabelLayer()
    })
  );

  labelLayer.setMap(map);

  let poiVisible = true;
  document.getElementById('togglePoi').onclick = () => {
    if (poiVisible) {
      labelLayer.setMap(null);
      togglePoi.innerText = 'POI 켜기';
    } else {
      labelLayer.setMap(map);
      togglePoi.innerText = 'POI 끄기';
    }
    poiVisible = !poiVisible;
  };
</script>

</body>
</html>
