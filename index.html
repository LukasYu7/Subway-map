<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Naver Map POI Toggle</title>
  <style>
    body { margin: 0; }
    #map { width: 100vw; height: 100vh; }
    .controls {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: white;
      padding: 8px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,.25);
      font-family: sans-serif;
    }
    button {
      padding: 6px 10px;
      cursor: pointer;
    }
  </style>

  <!-- 🔑 여기에 네이버 지도 Client ID -->
  <script
    src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpClientId=3kxddohdsq">
  </script>
</head>
<body>

<div class="controls">
  <button id="toggleLabel">POI 끄기</button>
</div>

<div id="map"></div>

<script>
  // 1️⃣ 지도 생성 (배경 지도만)
  const map = new naver.maps.Map('map', {
    center: new naver.maps.LatLng(37.5665, 126.9780),
    zoom: 15,
    mapTypes: new naver.maps.MapTypeRegistry({
      normal: naver.maps.NaverStyleMapTypeOptions.getVectorMap()
    })
  });

  // 2️⃣ POI / 라벨 레이어
  const labelMapType =
    naver.maps.NaverStyleMapTypeOptions.getNormalLabelLayer();

  const labelLayer = new naver.maps.Layer(
    'label',
    new naver.maps.MapTypeRegistry({ label: labelMapType })
  );

  // 처음엔 켜둠
  labelLayer.setMap(map);

  let visible = true;

  // 3️⃣ 토글 버튼
  document.getElementById('toggleLabel').onclick = () => {
    if (visible) {
      labelLayer.setMap(null);
      toggleLabel.innerText = 'POI 켜기';
    } else {
      labelLayer.setMap(map);
      toggleLabel.innerText = 'POI 끄기';
    }
    visible = !visible;
  };
</script>

</body>
</html>
